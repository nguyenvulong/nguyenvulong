  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ec4899"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="bgG" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#140a24"/></linearGradient>
