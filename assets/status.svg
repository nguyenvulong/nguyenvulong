    .flow{animation:flow 1s linear infinite;}
    @keyframes flow{to{stroke-dashoffset:-20}}
    .ecg{animation:ecg 4s linear infinite;}
    @keyframes ecg{to{transform:translateX(-600px)}}
  </style>
